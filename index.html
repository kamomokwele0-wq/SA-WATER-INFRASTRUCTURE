<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title>SA-WATER INFRASTRUCTURE</title>
    </head>
    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="data/valvespoint_1.js"></script>
        <script src="data/waterpipes_2.js"></script>
        <script>
        var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;

            if (e.target.feature.geometry.type === 'LineString' || e.target.feature.geometry.type === 'MultiLineString') {
              highlightLayer.setStyle({
                color: 'rgba(255, 255, 144, 1.00)',
              });
            } else {
              highlightLayer.setStyle({
                fillColor: 'rgba(255, 255, 144, 1.00)',
                fillOpacity: 1
              });
            }
            highlightLayer.openPopup();
        }
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[-26.29220658680571,27.982079449276153],[-26.18095875142757,28.206610680745897]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var abstract = new L.Control({'position':'bottomright'});
        abstract.onAdd = function (map) {
            this._div = L.DomUtil.create('div',
            'leaflet-control abstract');
            this._div.id = 'abstract'

                abstract.show();
                return this._div;
            };
            abstract.show = function () {
                this._div.classList.remove("abstract");
                this._div.classList.add("abstractUncollapsed");
                this._div.innerHTML = 'Water infrastructure network map – Turffontein, Johannesburg. Shows pipes and valves with condition and asset values.';
        };
        abstract.addTo(map);
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_OSMStandard_0');
        map.getPane('pane_OSMStandard_0').style.zIndex = 400;
        var layer_OSMStandard_0 = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            pane: 'pane_OSMStandard_0',
            opacity: 1.0,
            attribution: '<a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors, CC-BY-SA</a>',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 19
        });
        layer_OSMStandard_0;
        map.addLayer(layer_OSMStandard_0);
        function pop_valvespoint_1(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                    if (typeof layer.closePopup == 'function') {
                        layer.closePopup();
                    } else {
                        layer.eachLayer(function(feature){
                            feature.closePopup()
                        });
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">asset id</th>\
                        <td>' + (feature.properties['asset id'] !== null ? autolinker.link(String(feature.properties['asset id']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">material</th>\
                        <td>' + (feature.properties['material'] !== null ? autolinker.link(String(feature.properties['material']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">diameter</th>\
                        <td>' + (feature.properties['diameter'] !== null ? autolinker.link(String(feature.properties['diameter']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">condition</th>\
                        <td>' + (feature.properties['condition'] !== null ? autolinker.link(String(feature.properties['condition']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_valvespoint_1_0(feature) {
            switch(String(feature.properties['condition'])) {
                case '1':
                    return {
                pane: 'pane_valvespoint_1',
                radius: 8.0,
                opacity: 1,
                color: 'rgba(179,92,21,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 2.0,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(156,200,24,1.0)',
                interactive: true,
            }
                    break;
                case '2':
                    return {
                pane: 'pane_valvespoint_1',
                radius: 8.0,
                opacity: 1,
                color: 'rgba(179,92,21,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 2.0,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(123,211,240,1.0)',
                interactive: true,
            }
                    break;
                case '3':
                    return {
                pane: 'pane_valvespoint_1',
                radius: 8.0,
                opacity: 1,
                color: 'rgba(179,92,21,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 2.0,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(56,211,95,1.0)',
                interactive: true,
            }
                    break;
                case '4':
                    return {
                pane: 'pane_valvespoint_1',
                radius: 8.0,
                opacity: 1,
                color: 'rgba(179,92,21,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 2.0,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(108,75,208,1.0)',
                interactive: true,
            }
                    break;
                case '5':
                    return {
                pane: 'pane_valvespoint_1',
                radius: 8.0,
                opacity: 1,
                color: 'rgba(179,92,21,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 2.0,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(206,101,69,1.0)',
                interactive: true,
            }
                    break;
            }
        }
        map.createPane('pane_valvespoint_1');
        map.getPane('pane_valvespoint_1').style.zIndex = 401;
        map.getPane('pane_valvespoint_1').style['mix-blend-mode'] = 'normal';
        var layer_valvespoint_1 = new L.geoJson(json_valvespoint_1, {
            attribution: '',
            interactive: true,
            dataVar: 'json_valvespoint_1',
            layerName: 'layer_valvespoint_1',
            pane: 'pane_valvespoint_1',
            onEachFeature: pop_valvespoint_1,
            pointToLayer: function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.circleMarker(latlng, style_valvespoint_1_0(feature));
            },
        });
        bounds_group.addLayer(layer_valvespoint_1);
        map.addLayer(layer_valvespoint_1);
        function pop_waterpipes_2(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                    if (typeof layer.closePopup == 'function') {
                        layer.closePopup();
                    } else {
                        layer.eachLayer(function(feature){
                            feature.closePopup()
                        });
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">ASSET ID </th>\
                        <td>' + (feature.properties['ASSET ID'] !== null ? autolinker.link(String(feature.properties['ASSET ID']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">MATERIAL</th>\
                        <td>' + (feature.properties['MATERIAL'] !== null ? autolinker.link(String(feature.properties['MATERIAL']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">DIAMETER</th>\
                        <td>' + (feature.properties['DIAMETER'] !== null ? autolinker.link(String(feature.properties['DIAMETER']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">CONDITION</th>\
                        <td>' + (feature.properties['CONDITION'] !== null ? autolinker.link(String(feature.properties['CONDITION']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">INSTALDATE</th>\
                        <td>' + (feature.properties['INSTALDATE'] !== null ? autolinker.link(String(feature.properties['INSTALDATE']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">pipe asset register — Sheet1_PURCHASE VALUE </th>\
                        <td>' + (feature.properties['pipe asset register — Sheet1_PURCHASE VALUE '] !== null ? autolinker.link(String(feature.properties['pipe asset register — Sheet1_PURCHASE VALUE ']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">pipe asset register — Sheet1_BOOK VALUE </th>\
                        <td>' + (feature.properties['pipe asset register — Sheet1_BOOK VALUE '] !== null ? autolinker.link(String(feature.properties['pipe asset register — Sheet1_BOOK VALUE ']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['pipe asset register — Sheet1_CONDITION '] !== null ? autolinker.link(String(feature.properties['pipe asset register — Sheet1_CONDITION ']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_waterpipes_2_0(feature) {
            if (feature.properties['pipe asset register — Sheet1_BOOK VALUE '] >= 12000.000000 && feature.properties['pipe asset register — Sheet1_BOOK VALUE '] <= 12000.000000 ) {
                return {
                pane: 'pane_waterpipes_2',
                opacity: 1,
                color: 'rgba(228,255,95,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 3.0,
                fillOpacity: 0,
                interactive: true,
            }
            }
            if (feature.properties['pipe asset register — Sheet1_BOOK VALUE '] >= 12000.000000 && feature.properties['pipe asset register — Sheet1_BOOK VALUE '] <= 15000.000000 ) {
                return {
                pane: 'pane_waterpipes_2',
                opacity: 1,
                color: 'rgba(228,198,79,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 3.0,
                fillOpacity: 0,
                interactive: true,
            }
            }
            if (feature.properties['pipe asset register — Sheet1_BOOK VALUE '] >= 15000.000000 && feature.properties['pipe asset register — Sheet1_BOOK VALUE '] <= 27000.000000 ) {
                return {
                pane: 'pane_waterpipes_2',
                opacity: 1,
                color: 'rgba(227,141,62,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 3.0,
                fillOpacity: 0,
                interactive: true,
            }
            }
            if (feature.properties['pipe asset register — Sheet1_BOOK VALUE '] >= 27000.000000 && feature.properties['pipe asset register — Sheet1_BOOK VALUE '] <= 52000.000000 ) {
                return {
                pane: 'pane_waterpipes_2',
                opacity: 1,
                color: 'rgba(227,83,45,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 3.0,
                fillOpacity: 0,
                interactive: true,
            }
            }
            if (feature.properties['pipe asset register — Sheet1_BOOK VALUE '] >= 52000.000000 && feature.properties['pipe asset register — Sheet1_BOOK VALUE '] <= 85000.000000 ) {
                return {
                pane: 'pane_waterpipes_2',
                opacity: 1,
                color: 'rgba(227,26,28,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 3.0,
                fillOpacity: 0,
                interactive: true,
            }
            }
        }
        map.createPane('pane_waterpipes_2');
        map.getPane('pane_waterpipes_2').style.zIndex = 402;
        map.getPane('pane_waterpipes_2').style['mix-blend-mode'] = 'normal';
        var layer_waterpipes_2 = new L.geoJson(json_waterpipes_2, {
            attribution: '',
            interactive: true,
            dataVar: 'json_waterpipes_2',
            layerName: 'layer_waterpipes_2',
            pane: 'pane_waterpipes_2',
            onEachFeature: pop_waterpipes_2,
            style: style_waterpipes_2_0,
        });
        bounds_group.addLayer(layer_waterpipes_2);
        map.addLayer(layer_waterpipes_2);
        var overlaysTree = [
            {label: 'water pipes<br /><table><tr><td style="text-align: center;"><img src="legend/waterpipes_2_12000120000.png" /></td><td>12000 - 12000</td></tr><tr><td style="text-align: center;"><img src="legend/waterpipes_2_12000150001.png" /></td><td>12000 - 15000</td></tr><tr><td style="text-align: center;"><img src="legend/waterpipes_2_15000270002.png" /></td><td>15000 - 27000</td></tr><tr><td style="text-align: center;"><img src="legend/waterpipes_2_27000520003.png" /></td><td>27000 - 52000</td></tr><tr><td style="text-align: center;"><img src="legend/waterpipes_2_52000850004.png" /></td><td>52000 - 85000</td></tr></table>', layer: layer_waterpipes_2},
            {label: 'valves/point<br /><table><tr><td style="text-align: center;"><img src="legend/valvespoint_1_10.png" /></td><td>1</td></tr><tr><td style="text-align: center;"><img src="legend/valvespoint_1_21.png" /></td><td>2</td></tr><tr><td style="text-align: center;"><img src="legend/valvespoint_1_32.png" /></td><td>3</td></tr><tr><td style="text-align: center;"><img src="legend/valvespoint_1_43.png" /></td><td>4</td></tr><tr><td style="text-align: center;"><img src="legend/valvespoint_1_54.png" /></td><td>5</td></tr></table>', layer: layer_valvespoint_1},
            {label: "OSM Standard", layer: layer_OSMStandard_0},]
        var lay = L.control.layers.tree(null, overlaysTree,{
            //namedToggle: true,
            //selectorBack: false,
            //closedSymbol: '&#8862; &#x1f5c0;',
            //openedSymbol: '&#8863; &#x1f5c1;',
            //collapseAll: 'Collapse all',
            //expandAll: 'Expand all',
            collapsed: true,
        });
        lay.addTo(map);
        setBounds();
        </script>        
    </body>
</html>
